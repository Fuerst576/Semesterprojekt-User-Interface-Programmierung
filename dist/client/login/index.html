<!DOCTYPE html><html lang="en"> <head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Login</title><style>:root{--bg-main: #FFF1E6;--bg-nav: #C96A4A;--bg-card: #FFFFFF;--bg-card-hover: #FFE3D4;--accent: #E07A5F;--text-dark: #3A1F1A}html.dark{--bg-main: #0d0950;--bg-nav: #1a1464;--bg-card: #1c1a3d;--bg-card-hover: #2b2670;--accent: #ff9776;--text-dark: #ffffff}html{background-color:var(--bg-main);font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;height:100%}body{margin:0;color:var(--text-dark);height:100%}#main-menu{background-color:var(--bg-nav);display:flex;align-items:center;padding:0 2rem;height:80px}.nav-links a{color:#fff;text-decoration:none;margin-right:1.5rem;font-size:2rem;font-weight:600;opacity:.9}.nav-links a:hover{opacity:1;text-decoration:underline;background-color:var(--accent)}#logout{margin-left:auto;background:var(--accent);color:var(--bg-main);padding:6px 12px;border-radius:6px;font-weight:700;text-decoration:none}.content{flex:1;max-width:1200px;margin:0 auto;padding:2rem}h1{font-size:3.2rem;margin-bottom:1rem;display:flex;flex-direction:column;align-items:center}#genreFilter,#filmhinzufugen,form#hinzufügen button,form button{background-color:var(--bg-nav);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:1rem;cursor:pointer;transition:background .2s ease;margin-bottom:.5rem}#genreFilter:hover,#filmhinzufugen:hover,form#hinzufügen button:hover,form button:hover{background-color:var(--accent)}#filmlist{list-style:none;padding:0;margin:2rem;display:flex;flex-direction:row;flex-wrap:wrap;justify-content:center}.filmlist-item{margin:auto 1rem;width:500px;height:110px;display:flex;justify-content:center;align-items:center;background-color:var(--bg-card);border-radius:14px;font-size:1.1rem;font-weight:600;box-shadow:0 8px 20px #0000000d;transition:transform .2s ease,box-shadow .2s ease,background .2s ease}.filmlist-item:hover{background-color:var(--bg-card-hover);transform:translateY(-4px);box-shadow:0 12px 28px #0000001f}.filmlist-a{text-decoration:none;color:inherit}footer{background-color:var(--bg-nav);color:#fff;padding:1rem 2rem;display:flex;gap:2rem}form#hinzufügen{background-color:var(--bg-card);padding:2rem;border-radius:12px;box-shadow:0 6px 20px #0000001a;width:100%;max-width:500px;display:flex;flex-direction:column;gap:1.2rem}form#hinzufügen label,form label{font-weight:600;margin-bottom:.3rem;display:block}form#hinzufügen input,form#hinzufügen select,form input,form select{padding:.6rem .8rem;border-radius:8px;border:1px solid #ccc;font-size:1rem;width:100%;box-sizing:border-box;transition:border-color .3s ease}form#hinzufügen input:focus,form#hinzufügen select:focus,form input:focus,form select:focus{border-color:var(--accent);outline:none}a{display:flex;justify-content:center;align-items:center;margin-top:1rem;color:var(--accent);text-decoration:none;font-weight:500}a:hover{text-decoration:underline}.container{display:flex;flex-direction:column;align-items:center;justify-content:center}.lr{margin:auto;width:800px}.lr input{margin:10px}#reviewlist{list-style:none;padding:0;margin:2rem;display:flex;flex-direction:column;gap:1rem}
</style></head> <body> <h1>Login</h1> <div class="lr"> <form id="loginForm"> <input type="text" id="username" placeholder="Username" required> <br> <input type="password" id="password" placeholder="Password" required> <br> <button type="submit">Login</button> </form> <a href="/register">Register</a> <p id="error" style="color:red;"></p> </div> <script type="module">const a=document.getElementById("loginForm"),s=document.getElementById("error");a.addEventListener("submit",async t=>{t.preventDefault();const e=await fetch("https://mt241022-10927.node.ustp.cloud/Login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:document.getElementById("username").value,password:document.getElementById("password").value})});if(e.ok){const n=document.getElementById("username").value,o=await e.json();localStorage.setItem("token",o.token),localStorage.setItem("username",n),window.location.href="/"}else s.textContent="Login fehlgeschlagen"});</script> </body> </html>
